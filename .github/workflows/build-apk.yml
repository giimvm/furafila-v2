name: Gerar APK (Android)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências e gerar o site
        run: |
          npm install
          npm run build

      - name: Criar o projeto Android a partir do site
        run: |
          npx cap add android
          npx cap sync android

      - name: Compilar o APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar o APK para download
        uses: actions/upload-artifact@v4
        with:
          name: cantina-cesar-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
